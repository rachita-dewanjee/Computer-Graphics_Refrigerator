<body>
    <script src="js/three.js"></script>
    <script>
	    var socket = {     //camera lookAt height and movement speed
            height: 0.5,
            speed: 0.1
        }
        var click = 1;
        var degree = 0;
	    var keyboard = {};
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        renderer.setClearColor(0xA2D5C6, 1);
        renderer.clear();

        //new new THREE.PerspectiveCamera(FOV, viewAspectRatio, zNear, zFar)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
		camera.position.x = -1;
		camera.position.y = 0.5;
        camera.position.z = 5;
		camera.position.set(0, socket.height, -7.5);
        camera.lookAt(new THREE.Vector3(0, socket.height, 0));
       //camera position done
	   
	   
	    //width', 'height', and 'depth'
        const geometry = new THREE.BoxGeometry(2, 5, 2);
		//const floorgeometry =  new THREE.PlaneGeometry(10, 10, 10, 10);
        const texture = new THREE.TextureLoader().load('./images/ref.jpg');
		
		/*const texture_5 = new THREE.TextureLoader().load('./images/texture_5.jpg');
		texture_5.wrapS = THREE.RepeatWrapping;
        texture_5.wrapT = THREE.RepeatWrapping;
        texture_5.repeat.set(5, 5);*/
		
        const material = new THREE.MeshPhongMaterial({
		     color: 0xffffff,
            map: texture
        });
        
        const cube = new THREE.Mesh(geometry, material);
		cube.receiveShadow = true;
        cube.castShadow = true;
        scene.add(cube);
		
		/*floor
		const material2 = new THREE.MeshPhongMaterial({
		     color: 0xffffff,
			 wireframe: false,
            map: texture_5
        });
        
        const floor = new THREE.Mesh(floorgeometry, material);
		floor.receiveShadow = true;
        floor.castShadow = true;
        scene.add(floor);
		
		floor*/
	
		
       //lighting
        const color = 0x00FFFF;
        const intensity = 10;
        const distance = 100;
        
        const light = new THREE.DirectionalLight(color, intensity, distance);
		light.position.set(30, 30, 30);
		light.castShadow = true;
        light.shadow.camera.near = .5;
         light.shadow.camera.far = 15;
        scene.add(light);

        //lighting done
        renderer.render(scene, camera);
		
		

  function animate() {
  
    requestAnimationFrame(animate);
			
			
	//Up(w)
    if (keyboard[87]) {
        camera.position.x -= Math.sin(camera.rotation.y) * socket.speed;
        camera.position.z -= -Math.cos(camera.rotation.y) * socket.speed;
    }
    //Down(s)
    if (keyboard[83]) {
        camera.position.x += Math.sin(camera.rotation.y) * socket.speed;
        camera.position.z += -Math.cos(camera.rotation.y) * socket.speed;
    }
	
	//left(a)
    if (keyboard[65]) {
        camera.position.x += Math.sin(camera.rotation.y + Math.PI / 2) * socket.speed;
        camera.position.z += -Math.cos(camera.rotation.y + Math.PI / 2) * socket.speed;
    }
    //Right(d)
    if (keyboard[68]) {
        camera.position.x += Math.sin(camera.rotation.y - Math.PI / 2) * socket.speed;
        camera.position.z += -Math.cos(camera.rotation.y - Math.PI / 2) * socket.speed;
    }
			
	//keyboard done		
			
    //cube.rotation.y += 0.01;
	//lighting animation
	   if (degree < 360) {
                    
		degree += 0.5;
					
			}
        else {
        degree = 0;
             }

    light.position.x = Math.sin(degree * Math.PI / 180)*3 ;
    light.position.z = Math.cos(degree * Math.PI / 180)*3;
			
	//lightAnimation done
              
    renderer.render(scene, camera);
        
	    };

            break;

//mouseclick
		
		
     animate();
		
	
		
		
		
function keyDown(event) {
    keyboard[event.keyCode] = true;
}

function keyUp(event) {
    keyboard[event.keyCode] = false;
}



	
		
//eventListener
window.addEventListener('keydown', keyDown);
window.addEventListener('keyup', keyUp);
window.addEventListener('click', onClick);
